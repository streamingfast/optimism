[package]
name = "reth-optimism-firehose"
# Tracks the public op-reth release line (currently v2.2.4); deliberately diverges from the
# internal versioning sibling op-reth crates carry (those have not been updated to align with
# the public release tags).
version = "2.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"

[lints]
workspace = true

[features]
default = []
# Mirror of the upstream `reth-engine-tree` `trie-debug` feature so the cloned
# `engine_validator.rs` file does not emit `unexpected cfg` warnings. Currently
# unused; enabling it would also require wiring `reth-trie-sparse`.
trie-debug = []

[dependencies]
# reth (SF fork — see rust/Cargo.toml workspace deps)
reth-evm.workspace = true
reth-revm.workspace = true
reth-errors.workspace = true
reth-firehose.workspace = true
reth-primitives-traits.workspace = true

# reth — used by `engine_validator.rs` (cloned from `reth_engine_tree::tree::payload_validator`).
reth-chain-state.workspace = true
reth-chainspec.workspace = true
reth-consensus.workspace = true
reth-engine-primitives.workspace = true
reth-engine-tree.workspace = true
reth-execution-cache.workspace = true
reth-payload-primitives.workspace = true
reth-provider.workspace = true
reth-node-api.workspace = true
reth-node-builder.workspace = true
reth-tasks.workspace = true
reth-trie.workspace = true
reth-trie-db.workspace = true
reth-trie-parallel.workspace = true

# firehose tracer (crates.io)
firehose-tracer.workspace = true

# op-reth internal crates
reth-optimism-evm.workspace = true
reth-optimism-primitives.workspace = true

# alloy
alloy-evm.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-op-evm.workspace = true
alloy-eips.workspace = true

# op-alloy — needed (transitively, via feature activation) to bring in the
# `SignatureFields` impl for `OpTxEnvelope` (orphan-rule-driven; see
# `op-alloy/crates/consensus/src/firehose.rs`).
op-alloy-consensus = { workspace = true, features = ["firehose"] }

# op-revm
op-revm.workspace = true

# revm
revm-primitives.workspace = true

# misc — used by the cloned engine validator
crossbeam-channel.workspace = true
derive_more = { workspace = true, features = ["debug"] }
eyre.workspace = true
tokio = { workspace = true, default-features = false, features = ["sync"] }
tracing.workspace = true

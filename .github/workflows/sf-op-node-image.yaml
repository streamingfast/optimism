name: sf-op-node-image

# StreamingFast-specific: builds only the op-node image from this branch and
# pushes it to ghcr.io/streamingfast/op-node. Not part of upstream CI.

on:
  push:
    branches:
      - "sf/op-node-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/op-node

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version metadata
        id: vars
        run: |
          echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          # sf/op-node-v1.19.4-pruned-l1 -> v1.19.4-pruned-l1
          echo "version=$(echo "${GITHUB_REF_NAME}" | sed 's|^sf/op-node-||; s|/|-|g')" >> "$GITHUB_OUTPUT"

      - name: Build and push op-node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/op-stack-go/Dockerfile
          target: op-node-target
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.vars.outputs.git_commit }}
            GIT_DATE=${{ steps.vars.outputs.git_date }}
            OP_NODE_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}

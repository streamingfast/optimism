name: sf-op-node-image

# StreamingFast-specific: builds only the op-node image and pushes it to
# ghcr.io/streamingfast/op-node. Not part of upstream CI.
#
# Releases are cut from git tags `sf-op-node-v*` (no slash before the v:
# a slashed tag like op-node/v1.2.3-sf would also match the inherited
# upstream workflows' `*/v*` tag trigger). The docker tag is the git tag
# minus the `sf-op-node-` prefix. Tags are cut from the release/op-node-*
# branch. Branch pushes still build, but only publish the commit-sha
# docker tag.

on:
  push:
    branches:
      - "release/op-node-*"
    tags:
      - "sf-op-node-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/op-node

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Dockerfile regenerates superchain-configs.zip from the
      # superchain-registry submodule copied into the build context.
      - name: Init superchain-registry submodule
        run: git submodule update --init superchain-registry

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version metadata
        id: vars
        run: |
          echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # sf-op-node-v1.19.4-pruned-l1 -> v1.19.4-pruned-l1
            version="${GITHUB_REF_NAME#sf-op-node-}"
          else
            # Branch build: no human-readable docker tag, sha only.
            version=""
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE}:${GITHUB_SHA}"
          [[ -n "$version" ]] && tags="${tags},${IMAGE}:${version}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push op-node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/op-stack-go/Dockerfile
          target: op-node-target
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.vars.outputs.git_commit }}
            GIT_DATE=${{ steps.vars.outputs.git_date }}
            OP_NODE_VERSION=${{ steps.vars.outputs.version || github.sha }}
          tags: ${{ steps.vars.outputs.tags }}
